# nginx-app.conf — Nginx config for the application container.
#
# This is the *inner* Nginx (serving the static site on port 3000).
# It is different from the reverse-proxy Nginx config in nginx/default.conf.
#
# Listening on 3000 makes it unambiguous that this is an internal app
# server, not a public-facing proxy.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve all files; fall back to index.html for any unknown path
    # (supports future client-side routing if needed).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: add cache headers.
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Minimal error handling.
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # Disable access log for this internal container to reduce noise.
    access_log off;
    error_log  /var/log/nginx/error.log warn;
}

