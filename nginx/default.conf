# nginx/default.conf — Reverse proxy configuration for the Nginx proxy container.
#
# This is the *public-facing* Nginx. It receives all HTTP traffic from the host
# (via the published port) and forwards it to the application container over
# the internal Docker network.
#
# Design decisions:
#   - The upstream block uses the Compose service name ("webapp") as the hostname.
#     Docker's embedded DNS resolves this to the app container's IP automatically.
#     Hardcoding IPs would break every time containers are recreated.
#   - The application port (3000) is never published to the host. Traffic can
#     only reach it through this proxy.
#   - A dedicated /healthz location returns 200 directly from Nginx without
#     touching the upstream. This lets load balancers and health-check scripts
#     verify that the proxy itself is running, independently of the app.

# ---------------------------------------------------------------------------
# Upstream block — points to the app container on the internal Docker network.
# ---------------------------------------------------------------------------
upstream webapp_upstream {
    # "webapp" is the Compose service name; Docker DNS resolves it inside app-net.
    # Port 3000 matches the EXPOSE and listen directive in the app container.
    server webapp:3000;

    # keepalive: reuse connections to the upstream to reduce latency.
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Main server block — receives traffic on port 80 inside the proxy container.
# The host publishes this as ${NGINX_PORT} (default: 8080) via Compose.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;                 # Accept requests for any hostname.

    # --- Timeouts & limits ---------------------------------------------------
    # How long to wait for the upstream to respond.
    proxy_connect_timeout  5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Reject request bodies over 10 MB (suitable for a static-site proxy).
    client_max_body_size  10m;

    # --- Logging -------------------------------------------------------------
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log  warn;

    # --- Health endpoint (served by Nginx itself, no upstream needed) --------
    # GET /healthz → 200 OK with a plain text body.
    # Use this in Docker health checks, CI pipelines, and monitoring scripts.
    location = /healthz {
        access_log off;             # Avoid filling logs with health-check noise.
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Main proxy location -------------------------------------------------
    location / {
        proxy_pass         http://webapp_upstream;

        # Preserve the original HTTP version for the upstream connection.
        proxy_http_version 1.1;

        # Required for keepalive connections: clear the Connection header
        # so the upstream does not close the connection after each request.
        proxy_set_header Connection "";

        # Pass the original client information to the upstream application.
        # These are used by application-level logging and analytics.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Return a 502 Bad Gateway if the upstream is unreachable, rather than
        # timing out silently. Combined with proxy_connect_timeout above.
        proxy_intercept_errors on;
        error_page 502 503 504 @upstream_error;
    }

    # --- Upstream error handler ----------------------------------------------
    # Returns a friendly JSON error when the app container is not reachable.
    # This avoids exposing raw Nginx error pages to end users.
    location @upstream_error {
        default_type application/json;
        return 503 '{"error":"upstream_unavailable","message":"The application service is temporarily unavailable. Please try again shortly."}\n';
    }
}

